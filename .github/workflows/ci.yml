name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run tests (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "stable"]
    env:
      # Before Go 1.24, the linker writes the LC_UUID load command only when -B
      # is passed, and newer macOS versions refuse to run binaries without it.
      GOFLAGS: ${{ matrix.os == 'macos-latest' && matrix.go == '1.22' && '-ldflags=-B=gobuildid' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  prose:
    name: Check forbidden characters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-chars

  bundle:
    name: Generate and compile bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l pathlib tools)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Generate single-file bundles
        run: go run ./tools/bundle
      - name: Verify bundles compile
        run: go build ./dist/...
